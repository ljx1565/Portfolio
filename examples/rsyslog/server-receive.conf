# /etc/rsyslog.d/10-remote.conf  (central collector)
# One directory per sending host, one file per program.

module(load="imtcp")
input(type="imtcp" port="514" ruleset="ops_remote")

template(name="OpsRemoteFile" type="string"
         string="/data/remote/%FROMHOST-IP%/%PROGRAMNAME%.log")

ruleset(name="ops_remote") {
    action(type="omfile" dynaFile="OpsRemoteFile" createDirs="on")
    stop
}
