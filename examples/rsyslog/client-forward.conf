# /etc/rsyslog.d/90-forward.conf  (client side)
# Services that log to syslog are selected by facility; file-only services are read with imfile.
# LOG_SERVER is a placeholder for the central collector.

module(load="imfile")

input(type="imfile"
      File="/var/log/httpd/error_log"
      Tag="httpd-error:" Facility="local6" Severity="err"
      ruleset="to_log01")

input(type="imfile"
      File="/var/log/php-fpm/error.log"
      Tag="php-fpm:"
      ruleset="to_log01")

# MariaDB slow log spans several lines: group each entry into one message
input(type="imfile"
      File="/var/log/mariadb/slow.log"
      Tag="mariadb-slow:"
      startmsg.regex="^# Time:"
      ruleset="to_log01")

ruleset(name="to_log01") {
    action(type="omfwd" target="LOG_SERVER" port="514" protocol="tcp"
           # disk-assisted queue + endless retry: nothing is lost while the collector is down
           queue.type="LinkedList" queue.filename="fwd_log01"
           queue.maxDiskSpace="1g" queue.saveOnShutdown="on"
           action.resumeRetryCount="-1")
}

# everything that goes through syslog (HAProxy local2, maillog, kernel / iptables ...)
*.* call to_log01
