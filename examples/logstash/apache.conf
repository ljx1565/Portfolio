# Filebeat -> Logstash -> Elasticsearch
# One access-log line becomes source IP / URL / status / user agent fields, indexed per log_type.
input {
  beats { port => 5044 }
}

filter {
  if [log_type] == "apache_access" {
    grok  { match => { "message" => "%{COMBINEDAPACHELOG}" } }
    date  { match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ] }
    geoip { source => "[source][address]" }
  }
}

output {
  elasticsearch {
    hosts    => ["https://ES_HOST:9200"]
    index    => "logs-%{[log_type]}-%{+YYYY.MM.dd}"
    user     => "${ES_USER}"
    password => "${ES_PASSWORD}"   # from the Logstash keystore, never written in the file
  }
}
