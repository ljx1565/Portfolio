<!-- /var/ossec/etc/ossec.conf (agent): manager registration, FIM, active response -->
<ossec_config>
  <client>
    <server>
      <address>MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- web root in real time (web shell upload), /etc on schedule -->
  <syscheck>
    <directories realtime="yes" check_all="yes">/var/www/html</directories>
    <directories check_all="yes">/etc</directories>
  </syscheck>

  <!-- rule 5763 = 8 SSH auth failures within 120 s -> drop the source for 180 s -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5763</rules_id>
    <timeout>180</timeout>
  </active-response>
</ossec_config>
