# Targets live in separate files (file_sd): adding a server needs no restart.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: node_exporter
    file_sd_configs:
      - files: ['/etc/prometheus/targets/node_*.yml']
  - job_name: windows
    file_sd_configs:
      - files: ['/etc/prometheus/targets/windows_*.yml']
